# Need for Madness — PufferLib Ocean env defaults
# Drop into a PufferLib tree as config/nfm.ini (or merge [env] keys).

[env]
name = nfm
# Obs: float32[52]; Act: MultiDiscrete([2,2,2,2,2])
stage = 11
car = 0
seed = 0
nplayers = 7
max_steps = 100000
stall_cut = 1
repo_root = .
assets_dir = c/assets

[train]
# Staggered resets: Ocean c_reset bumps episode_id so vec seeds differ.
num_envs = 64
