[base]
env_name = nfm

[vec]
total_agents = 64
num_buffers = 2
num_threads = 8

[env]
stage = 11
car = 0
seed = 0
nplayers = 1
max_steps = 4000
stall_cut = 0
repo_root = ..
assets_dir = ../c/assets
record_path = ''

[policy]
hidden_size = 128
num_layers = 3

[train]
total_timesteps = 5000000
learning_rate = 0.0003
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 1.0
vf_clip_coef = 1.0
max_grad_norm = 1.0
ent_coef = 0.01
momentum = 0.9
minibatch_size = 2048
horizon = 64

[sweep]
metric = perf

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e6
max = 2e7
mean = 5e6
